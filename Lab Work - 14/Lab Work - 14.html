<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <title>Document</title>
</head>

<body>
    <div class="row justify-content-between m-2 p-2">
        <div class="col-md-5">
            <h1>Sign in</h1>
            <hr style="border:1px solid red" />
            <form>
            <div class="form-group">
                <label for="exampleInputEmail1">Username</label>
                <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Enter your email">
                <small id="emailHelp" class="form-text text-muted">We'll never share your email with anyone else.</small>
            </div>
            <div class="form-group">
                <label for="exampleInputPassword1">Password</label>
                <input type="password" class="form-control" id="exampleInputPassword1" placeholder="Confirm a password">
            </div>
            <div class="form-group form-check">
                <input type="checkbox" class="form-check-input" id="exampleCheck1">
                <label class="form-check-label" for="exampleCheck1">Remember me</label>
            </div>
            <button type="submit" class="btn btn-primary">Sign in</button>
            </form>
        </div>

        <div style="border:1px solid red"></div>
            <div class="col-md-6">
            <h1>Sign up</h1>
            <hr style="border:1px solid red" />
            <form>
            <div class="form-row">
            <div class="form-group col-md-6">
                <label for="inputEmail4">Name</label>
                <input type="email" class="form-control" id="inputEmail4" placeholder="Enter your name">
            </div>
            <div class="form-group col-md-6">
                <label for="inputPassword4">Username</label>
                <input type="email" class="form-control" id="inputEmail4" placeholder="Enter your email">
            </div>
        </div>
            <div class="form-group">
                <label for="inputAddress">Password</label>
                <input type="password" class="form-control" id="inputPassword4" placeholder="Create a password">
            </div>
            <div class="form-group">
                <label for="inputAddress2">Password</label>
                <input type="password" class="form-control" id="inputPassword4" placeholder="Confirm a password">
            </div>
            <div class="form-group">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="gridCheck">
                <label class="form-check-label" for="gridCheck">
                I accept all terms & conditions
                </label>
            </div>
            </div>
            <button type="submit" class="btn btn-primary">Sign up</button>
            </form>
    </div>
    
</body>
</html>
